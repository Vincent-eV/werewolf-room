<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>狼人杀发牌房</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; background: #1a1a24; color: #f0f0f5; }
    h1, h2, h3 { color: #e44d26; text-align: center; }
    .card { background: #252535; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    input, button { padding: 10px; font-size: 14px; border-radius: 5px; border: 1px solid #444; margin: 4px 0; box-sizing: border-box; }
    input { background: #171720; color: #fff; width: 100%; }
    button { background: #e44d26; color: #fff; cursor: pointer; border: none; font-weight: bold; width: 100%; margin-top: 10px; }
    button:hover { background: #ff5733; }
    button.secondary { background: #44445c; }
    .role-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .role-row input { margin: 0; }
    .role-row button { width: auto; margin: 0; padding: 0 12px; }
    .badge { display: inline-block; padding: 2px 6px; font-size: 12px; background: #f39c12; color: #000; border-radius: 4px; margin-left: 5px; font-weight: bold; }
    .identity-reveal { font-size: 24px; text-align: center; color: #2ecc71; padding: 15px; border: 2px dashed #2ecc71; border-radius: 8px; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: left; }
    th { background: #333348; }
  </style>
</head>
<body>

  <h1>🐺 狼人杀联机发牌房</h1>

  <!-- 1. 加入房间模块 -->
  <div id="join-view" class="card">
    <h2>加入 / 创建房间</h2>
    <input type="text" id="room-input" placeholder="输入房间号 (如: 8888)">
    <input type="text" id="name-input" placeholder="输入你的昵称">
    <button onclick="joinRoom()">进入房间</button>
  </div>

  <!-- 2. 房间主界面 -->
  <div id="room-view" style="display:none;">
    
    <!-- 玩家信息与法官认领 -->
    <div class="card">
      <h3 id="room-title">房间号</h3>
      <div><strong>当前玩家：</strong></div>
      <ul id="player-list"></ul>
      <button class="secondary" onclick="claimJudge()">👑 担任 / 抢选本局法官</button>
    </div>

    <!-- 身份配置 -->
    <div class="card" id="config-card">
      <h3>配置身份牌</h3>
      <div id="role-configs"></div>
      <button class="secondary" onclick="addRoleRow()">+ 添加新角色</button>
      <button onclick="saveAndSyncConfig()">保存并同步配置</button>
    </div>

    <!-- 游戏控制与发牌 -->
    <div class="card">
      <button onclick="startGame()">🎲 随机分发身份牌</button>
      <button class="secondary" onclick="resetGame()">🔄 重置本局</button>
    </div>

    <!-- 身份展示区 -->
    <div class="card" id="result-card" style="display:none;">
      <h3>你的身份信息</h3>
      <div id="my-role-display" class="identity-reveal"></div>
      <div id="judge-table-container" style="display:none; margin-top: 20px;">
        <h4>📜 全体身份清单 (法官专享)</h4>
        <table id="judge-table">
          <thead><tr><th>玩家</th><th>身份</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentConfig = [];

    function joinRoom() {
      const roomId = document.getElementById('room-input').value.trim();
      const name = document.getElementById('name-input').value.trim();
      if (!roomId || !name) return alert('请填写房间号和昵称');

      socket.emit('joinRoom', { roomId, name });
      document.getElementById('join-view').style.display = 'none';
      document.getElementById('room-view').style.display = 'block';
      document.getElementById('room-title').innerText = `房间号: ${roomId}`;
    }

    function claimJudge() {
      socket.emit('claimJudge');
    }

    function renderConfig(config) {
      currentConfig = config;
      const container = document.getElementById('role-configs');
      container.innerHTML = '';
      config.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'role-row';
        div.innerHTML = `
          <input type="text" value="${item.roleName}" placeholder="角色名" onchange="updateRoleData(${index}, 'roleName', this.value)">
          <input type="number" style="width: 80px;" value="${item.count}" min="0" placeholder="数量" onchange="updateRoleData(${index}, 'count', this.value)">
          <button class="secondary" onclick="removeRoleRow(${index})">✕</button>
        `;
        container.appendChild(div);
      });
    }

    function updateRoleData(index, field, value) {
      currentConfig[index][field] = field === 'count' ? parseInt(value, 10) || 0 : value;
    }

    function addRoleRow() {
      currentConfig.push({ roleName: '', count: 1 });
      renderConfig(currentConfig);
    }

    function removeRoleRow(index) {
      currentConfig.splice(index, 1);
      renderConfig(currentConfig);
    }

    function saveAndSyncConfig() {
      socket.emit('updateConfig', currentConfig);
      alert('配置已同步');
    }

    function startGame() {
      socket.emit('startGame');
    }

    function resetGame() {
      socket.emit('resetGame');
    }

    socket.on('roomData', (data) => {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      data.players.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = `${p.name} ${p.isJudge ? '<span class="badge">法官</span>' : ''}`;
        list.appendChild(li);
      });
      if (currentConfig.length === 0) {
        renderConfig(data.config);
      }
    });

    socket.on('configUpdated', (config) => {
      renderConfig(config);
    });

    socket.on('dealCards', (res) => {
      document.getElementById('result-card').style.display = 'block';
      document.getElementById('my-role-display').innerText = res.myRole;

      const judgeTableContainer = document.getElementById('judge-table-container');
      if (res.isJudge) {
        judgeTableContainer.style.display = 'block';
        const tbody = document.querySelector('#judge-table tbody');
        tbody.innerHTML = '';
        res.allRoles.forEach(p => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${p.name} ${p.isJudge ? '(法官)' : ''}</td><td><strong>${p.role}</strong></td>`;
          tbody.appendChild(tr);
        });
      } else {
        judgeTableContainer.style.display = 'none';
      }
    });

    socket.on('gameReset', () => {
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('judge-table-container').style.display = 'none';
      alert('本局已重置，可重新配置并开始发牌。');
    });

    socket.on('errorMsg', (msg) => {
      alert(msg);
    });
  </script>
</body>
</html>
