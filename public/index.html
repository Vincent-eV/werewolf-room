<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>狼人杀联机房间</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 15px; background: #121212; color: #f0f0f0; }
    .card { background: #1e1e1e; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; transition: all 0.3s ease; }
    h2, h3, h4 { margin-top: 0; color: #e94560; }
    input, button, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; }
    button { background: #e94560; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    button:disabled { background: #444 !important; color: #777 !important; cursor: not-allowed; }
    .btn-secondary { background: #0f3460; }
    .btn-warning { background: #9b59b6; }
    .btn-reset { background: #c0392b; }
    .btn-dead { background: #444; color: #888; }
    .btn-add { background: #27ae60; padding: 8px 12px; margin: 0; width: auto; font-size: 14px; }
    .btn-remove { background: #c0392b; padding: 4px 8px; margin: 0; width: auto; font-size: 12px; }
    .btn-success { background: #27ae60; }
    
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .role-item { background: #262626; padding: 8px; border-radius: 6px; border: 1px solid #3a3a3a; }
    .role-item label { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 4px; font-weight: bold; }
    .role-item input { margin: 0; padding: 8px; }

    .add-role-box { display: flex; gap: 8px; align-items: center; margin: 10px 0 16px 0; background: #252525; padding: 10px; border-radius: 6px; border: 1px dashed #555; }
    .add-role-box input { margin: 0; }

    .player-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #252525; border-radius: 6px; margin-bottom: 6px; }
    .player-row.dead { opacity: 0.5; text-decoration: line-through; }
    .badge { padding: 3px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-left: 4px; display: inline-block; }
    .badge-sheriff { background: #f39c12; color: #000; }
    .badge-judge { background: #9b59b6; color: #fff; }
    .badge-dead { background: #e74c3c; color: #fff; }
    .badge-alive { background: #2ecc71; color: #fff; }
    .badge-role { background: #e94560; color: #fff; font-size: 13px; }
    .role-display { font-size: 24px; font-weight: bold; text-align: center; padding: 20px; background: #0f3460; border-radius: 8px; margin: 10px 0; color: #ffeb3b; transition: all 0.3s ease; }
    
    /* 遮罩与弹窗设计 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-box { background: #1e1e1e; border: 2px solid #9b59b6; border-radius: 12px; padding: 24px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .modal-box h3 { margin-bottom: 12px; }
    .modal-btns { display: flex; gap: 10px; margin-top: 16px; }

    .pulse-dot { display: inline-block; width: 10px; height: 10px; background: #9b59b6; border-radius: 50%; margin: 0 3px; animation: pulse 1.2s infinite ease-in-out both; }
    .pulse-dot:nth-child(1) { animation-delay: -0.32s; }
    .pulse-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes pulse { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 加入界面 -->
  <div id="joinSection" class="card">
    <h2>🐺 狼人杀联机房间</h2>
    <input type="text" id="roomInput" placeholder="输入房间号 (如 888)">
    <input type="text" id="nameInput" placeholder="输入你的昵称">
    <label style="display:flex; align-items:center; gap:8px; margin: 10px 0;">
      <input type="checkbox" id="isJudgeCheck" style="width: auto;"> 我是法官 (主持人)
    </label>
    <button onclick="joinGame()">进入房间</button>
  </div>

  <!-- 游戏主大厅 -->
  <div id="gameSection" class="hidden">
    
    <!-- 普通玩家身份卡片 -->
    <div id="roleCard" class="card hidden">
      <h3 style="display: flex; align-items: center; flex-wrap: wrap; gap: 4px;">
        🎭 你的身份 
        <span id="mySheriffBadge"></span>
        <span id="myStatusBadge"></span>
      </h3>
      <div id="roleText" class="role-display">等待法官发牌...</div>
    </div>

    <!-- 警长移交卡片（仅警长阵亡后可见） -->
    <div id="sheriffPassSection" class="card hidden" style="border-color: #f39c12;">
      <h3>🎖️ 警长移交 / 撕毁警徽</h3>
      <p style="font-size:13px; color:#aaa;">你已出局，请移交或撕毁警徽：</p>
      <select id="sheriffTargetSelect"></select>
      <button class="btn-secondary" onclick="passSheriff()">确定移交</button>
      <button class="btn-dead" onclick="tearSheriff()">撕毁警徽</button>
    </div>

    <!-- 法官专属控制台 -->
    <div id="judgeSection" class="card hidden" style="border-color: #9b59b6;">
      <h3>⚖️ 法官控制台</h3>
      
      <!-- 动态角色网格 -->
      <div id="roleGrid" class="role-grid"></div>

      <!-- 添加新角色区域 -->
      <div class="add-role-box">
        <input type="text" id="newRoleName" placeholder="新角色名 (如: 恶灵骑士/白痴)" style="flex: 2;">
        <input type="number" id="newRoleCount" value="1" min="1" style="flex: 1;">
        <button class="btn-add" onclick="addNewRole()">➕ 添加角色</button>
      </div>

      <button class="btn-secondary" onclick="syncConfig()">💾 同步配置</button>
      <button id="startBtn" onclick="startGame()">🎲 开始分配角色 (仅法官)</button>
      <button class="btn-reset" onclick="confirmResetGame()">🔄 结束本局 (开始下一轮)</button>

      <hr style="border-color:#333; margin:15px 0;">
      
      <!-- 警长任命 -->
      <h4>🎖️ 警长任命</h4>
      <select id="judgeSheriffSelect"></select>
      <button class="btn-secondary" onclick="judgeAppointSheriff()">任命选中玩家为警长</button>

      <hr style="border-color:#333; margin:15px 0;">

      <!-- 移交法官 -->
      <h4>🔄 移交法官权限</h4>
      <select id="transferJudgeSelect"></select>
      <button class="btn-warning" onclick="requestTransferJudge()">请求移交法官给该玩家</button>
    </div>

    <!-- 玩家名单列表 -->
    <div class="card">
      <h3>👥 房间玩家 (<span id="playerCount">0</span>人)</h3>
      <div id="playerList"></div>
    </div>

  </div>

  <!-- 弹窗 1：法官发起后的等待界面 -->
  <div id="judgeWaitingModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>⏳ 正在移交法官</h3>
      <p style="color: #aaa; font-size: 14px; margin: 15px 0;">
        已向玩家 <strong id="waitingTargetName" style="color: #fff;"></strong> 发送移交邀请<br>
        等待对方确认中
        <span class="pulse-dot"></span>
        <span class="pulse-dot"></span>
        <span class="pulse-dot"></span>
      </p>
      <button class="btn-dead" onclick="cancelTransferJudge()">❌ 取消移交</button>
    </div>
  </div>

  <!-- 弹窗 2：被移交玩家的确认接收界面 -->
  <div id="judgeConfirmModal" class="modal-overlay hidden">
    <div class="modal-box" style="border-color: #e94560;">
      <h3 style="color: #ffeb3b;">⚖️ 法官权限移交邀请</h3>
      <p style="color: #ddd; font-size: 15px; margin: 16px 0;">
        法官 <strong id="fromJudgeNameText" style="color:#e94560;"></strong> 想要将法官权限移交给您。<br>
        接受后您将成为全场法官并主持本局。
      </p>
      <div class="modal-btns">
        <button class="btn-success" onclick="respondTransfer(true)" style="flex:1;">✅ 确认接受</button>
        <button class="btn-dead" onclick="respondTransfer(false)" style="flex:1;">❌ 拒绝</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myId = null;
    let pendingFromId = null;

    let currentRolesConfig = {
      '狼人': 3,
      '村民': 3,
      '预言家': 1,
      '女巫': 1,
      '猎人': 1,
      '守卫': 0
    };

    function renderRoleInputs() {
      const grid = document.getElementById('roleGrid');
      grid.innerHTML = '';

      Object.keys(currentRolesConfig).forEach(roleName => {
        const item = document.createElement('div');
        item.className = 'role-item';
        
        const isDefault = ['狼人', '村民', '预言家', '女巫', '猎人', '守卫'].includes(roleName);
        const deleteBtn = !isDefault ? `<button class="btn-remove" onclick="removeRole('${roleName}')">✕</button>` : '';

        item.innerHTML = `
          <label>
            <span>${roleName}</span>
            ${deleteBtn}
          </label>
          <input type="number" min="0" value="${currentRolesConfig[roleName]}" onchange="updateRoleValue('${roleName}', this.value)">
        `;
        grid.appendChild(item);
      });
    }

    function updateRoleValue(role, val) {
      currentRolesConfig[role] = parseInt(val) || 0;
    }

    function addNewRole() {
      const nameInput = document.getElementById('newRoleName');
      const countInput = document.getElementById('newRoleCount');
      const name = nameInput.value.trim();
      const count = parseInt(countInput.value) || 1;

      if (!name) return alert('请输入角色名称');
      if (currentRolesConfig.hasOwnProperty(name)) return alert('该角色已存在');

      currentRolesConfig[name] = count;
      nameInput.value = '';
      countInput.value = '1';
      renderRoleInputs();
      syncConfig();
    }

    function removeRole(roleName) {
      delete currentRolesConfig[roleName];
      renderRoleInputs();
      syncConfig();
    }

    function syncConfig() {
      socket.emit('updateConfig', currentRolesConfig);
    }

    function joinGame() {
      const roomId = document.getElementById('roomInput').value.trim();
      const playerName = document.getElementById('nameInput').value.trim();
      const isJudge = document.getElementById('isJudgeCheck').checked;

      if (!roomId || !playerName) return alert('请完整输入房间号与昵称');

      socket.emit('joinRoom', { roomId, playerName, isJudge });
      document.getElementById('joinSection').classList.add('hidden');
      document.getElementById('gameSection').classList.remove('hidden');
      renderRoleInputs();
    }

    function startGame() {
      syncConfig();
      socket.emit('startGame');
    }

    function confirmResetGame() {
      if (confirm('确定要结束本局并开始下一轮吗？\n所有玩家的身份、出局状态和警长归属将被重置。')) {
        socket.emit('resetGame');
      }
    }

    function toggleDeath(targetId) {
      socket.emit('toggleDeath', targetId);
    }

    function judgeAppointSheriff() {
      const targetId = document.getElementById('judgeSheriffSelect').value;
      if (targetId) socket.emit('setSheriff', targetId);
    }

    // 法官点击发起移交
    function requestTransferJudge() {
      const targetId = document.getElementById('transferJudgeSelect').value;
      if (!targetId) return alert('请先选择要移交的玩家');
      socket.emit('requestTransferJudge', targetId);
    }

    // 法官在等待弹窗中点击取消
    function cancelTransferJudge() {
      socket.emit('cancelTransferJudge');
    }

    // 被移交玩家点击接受或拒绝
    function respondTransfer(accept) {
      document.getElementById('judgeConfirmModal').classList.add('hidden');
      socket.emit('responseTransferJudge', { accept, fromId: pendingFromId });
      pendingFromId = null;
    }

    function passSheriff() {
      const targetId = document.getElementById('sheriffTargetSelect').value;
      if (targetId) socket.emit('setSheriff', targetId);
    }

    function tearSheriff() {
      socket.emit('setSheriff', null);
    }

    socket.on('connect', () => { myId = socket.id; });
    socket.on('errorMsg', (msg) => { alert(msg); });

    // 原法官端：弹出等待弹窗
    socket.on('transferWaitingStart', ({ targetName }) => {
      document.getElementById('waitingTargetName').innerText = `【${targetName}】`;
      document.getElementById('judgeWaitingModal').classList.remove('hidden');
    });

    // 原法官端：关闭等待弹窗
    socket.on('transferWaitingEnd', () => {
      document.getElementById('judgeWaitingModal').classList.add('hidden');
    });

    // 原法官端：收到对方拒绝通知
    socket.on('transferRejectedNotify', ({ targetName }) => {
      alert(`玩家【${targetName}】拒绝了法官权限移交请求。`);
    });

    // 被移交玩家端：弹出确认接收弹窗
    socket.on('askJudgeAccept', ({ fromId, fromName }) => {
      pendingFromId = fromId;
      document.getElementById('fromJudgeNameText').innerText = `【${fromName}】`;
      document.getElementById('judgeConfirmModal').classList.remove('hidden');
    });

    // 被移交玩家端：法官主动取消了移交
    socket.on('transferCancelledByJudge', () => {
      document.getElementById('judgeConfirmModal').classList.add('hidden');
      pendingFromId = null;
      alert('法官已取消本次权限移交。');
    });

    socket.on('transferAcceptedSuccess', () => {
      alert('🎉 恭喜！您已成功接任法官。');
    });

    socket.on('configUpdate', (config) => {
      currentRolesConfig = config;
      renderRoleInputs();
    });

    socket.on('roomUpdate', (room) => {
      const isMeJudge = (room.judgeId === myId);

      if (room.rolesConfig) {
        currentRolesConfig = room.rolesConfig;
        renderRoleInputs();
      }

      if (isMeJudge) {
        document.getElementById('judgeSection').classList.remove('hidden');
        document.getElementById('roleCard').classList.add('hidden');

        const startBtn = document.getElementById('startBtn');
        if (room.gameStarted) {
          startBtn.disabled = true;
          startBtn.innerText = '🔒 对局进行中 (需先结束本局)';
        } else {
          startBtn.disabled = false;
          startBtn.innerText = '🎲 开始分配角色 (仅法官)';
        }
      } else {
        document.getElementById('judgeSection').classList.add('hidden');
        document.getElementById('roleCard').classList.remove('hidden');
        
        const me = room.players[myId];
        if (me) {
          const myRole = me.role;
          document.getElementById('roleText').innerText = myRole || '等待法官发牌...';
          
          const sheriffBadge = document.getElementById('mySheriffBadge');
          const statusBadge = document.getElementById('myStatusBadge');
          const roleCard = document.getElementById('roleCard');
          const roleText = document.getElementById('roleText');

          const isMeSheriff = (room.sheriffId === myId);

          if (isMeSheriff && !me.isDead) {
            sheriffBadge.innerHTML = '<span class="badge badge-sheriff" style="font-size: 13px; margin-left: 6px;">🎖️ 警长</span>';
          } else {
            sheriffBadge.innerHTML = '';
          }

          if (me.isDead) {
            statusBadge.innerHTML = '<span class="badge badge-dead" style="font-size: 13px; margin-left: 6px;">💀 已阵亡</span>';
            roleCard.style.borderColor = '#e74c3c';
            roleText.style.backgroundColor = '#3b0b0b';
            roleText.style.color = '#888';
            roleText.style.textDecoration = 'line-through';
          } else {
            statusBadge.innerHTML = '<span class="badge badge-alive" style="font-size: 13px; margin-left: 6px;">🟢 存活</span>';
            roleCard.style.borderColor = '#333';
            roleText.style.backgroundColor = '#0f3460';
            roleText.style.color = '#ffeb3b';
            roleText.style.textDecoration = 'none';
          }
        }
      }

      const playerListEl = document.getElementById('playerList');
      const sheriffSelectEl = document.getElementById('judgeSheriffSelect');
      const transferSelectEl = document.getElementById('transferJudgeSelect');
      const passSelectEl = document.getElementById('sheriffTargetSelect');
      
      playerListEl.innerHTML = '';
      sheriffSelectEl.innerHTML = '<option value="">-- 选择警长 --</option>';
      transferSelectEl.innerHTML = '<option value="">-- 选择新法官 --</option>';
      passSelectEl.innerHTML = '<option value="">-- 选择继任者 --</option>';

      const players = Object.values(room.players);
      document.getElementById('playerCount').innerText = players.length;

      players.forEach(p => {
        const row = document.createElement('div');
        row.className = `player-row ${p.isDead ? 'dead' : ''}`;

        let tags = '';
        if (p.isJudge) tags += `<span class="badge badge-judge">法官</span>`;
        if (p.id === room.sheriffId) tags += `<span class="badge badge-sheriff">警长 🎖️</span>`;
        tags += `<span class="badge ${p.isDead ? 'badge-dead' : 'badge-alive'}">${p.isDead ? '已出局' : '存活'}</span>`;

        if (isMeJudge && !p.isJudge && p.role) {
          tags += `<span class="badge badge-role">【${p.role}】</span>`;
        }

        let actionBtn = '';
        if (isMeJudge && !p.isJudge) {
          actionBtn = `<button style="width:auto; padding:4px 8px; margin:0;" onclick="toggleDeath('${p.id}')">${p.isDead ? '撤销死亡' : '标记死亡'}</button>`;
        }

        row.innerHTML = `<div><strong>${p.name}</strong> ${tags}</div><div>${actionBtn}</div>`;
        playerListEl.appendChild(row);

        if (!p.isJudge) {
          sheriffSelectEl.add(new Option(p.name, p.id));
          transferSelectEl.add(new Option(p.name, p.id));
          if (!p.isDead) passSelectEl.add(new Option(p.name, p.id));
        }
      });

      const amISheriff = (room.sheriffId === myId);
      const amIDead = room.players[myId]?.isDead;
      if (amISheriff && amIDead) {
        document.getElementById('sheriffPassSection').classList.remove('hidden');
      } else {
        document.getElementById('sheriffPassSection').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
